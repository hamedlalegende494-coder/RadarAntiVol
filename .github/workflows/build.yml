name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le projet Android
        run: unzip -o RadarAntiVol.zip

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Compiler l'APK (debug)
        working-directory: RadarAntiVol
        run: gradle assembleDebug

      - name: Publier l'APK compilé
        uses: actions/upload-artifact@v4
        with:
          name: RadarAntiVol-debug-apk
          path: RadarAntiVol/app/build/outputs/apk/debug/app-debug.apk
